<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rich Indigo Background Gradient -->
    <linearGradient id="tpl-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Glass / Gloss Top Highlight -->
    <linearGradient id="tpl-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow for tactile floating tiles -->
    <filter id="tpl-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="64" height="64" rx="16" fill="url(#tpl-bg)"/>
  
  <!-- Subtle Top Sheen Highlight -->
  <rect x="1" y="1" width="62" height="28" rx="15" fill="url(#tpl-gloss)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>

  <!-- Subtle Acoustic Frequency Equalizer Waves in Background -->
  <path d="M11 48V46 M15 50V44 M19 53V41 M45 53V41 M49 50V44 M53 48V46" 
        stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Left Pitch Tile (Tone 2: Rising) -->
  <g filter="url(#tpl-shadow)">
    <rect x="11" y="14" width="18" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- Pitch Curve: Rising 3 -> 5 -->
    <path d="M15 31 L25 21" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <!-- Tone contour nodes -->
    <circle cx="15" cy="31" r="1.75" fill="#F59E0B"/>
    <circle cx="25" cy="21" r="1.75" fill="#4F46E5"/>
  </g>

  <!-- Center Link (Pair Pulse Dots) -->
  <circle cx="32" cy="24" r="1.5" fill="#A5B4FC"/>
  <circle cx="32" cy="28" r="1" fill="#C7D2FE" fill-opacity="0.7"/>

  <!-- Right Pitch Tile (Tone 4: Falling) -->
  <g filter="url(#tpl-shadow)">
    <rect x="35" y="14" width="18" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- Pitch Curve: Falling 5 -> 1 -->
    <path d="M39 21 L49 31" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <!-- Tone contour nodes -->
    <circle cx="39" cy="21" r="1.75" fill="#4F46E5"/>
    <circle cx="49" cy="31" r="1.75" fill="#10B981"/>
  </g>

  <!-- Bottom Frequency / Pitch Waveform Pill -->
  <rect x="21" y="44" width="22" height="10" rx="5" fill="#1E1B4B" fill-opacity="0.55"/>
  <path d="M24 49 H26 L28.5 46 L30.5 52 L32.5 46 L34.5 52 L36.5 49 H40" 
        stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
