<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>FlashCards - Progress</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#4361ee',
              600: '#3a4fe0',
              teal: '#00b894',
              tealLight: '#00cec9',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scroll-and-touch">
    /* Remove tap highlight & scrollbars for native app feel */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#F4F7FB] text-slate-800 flex justify-center items-center min-h-screen font-sans sm:py-6">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[390px] h-[844px] bg-[#F7F9FD] rounded-[48px] shadow-2xl overflow-hidden flex flex-col relative border-[8px] border-slate-900 border-opacity-10">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-xs font-semibold select-none z-20" data-purpose="status-bar">
<span>9:41</span>
<!-- Dynamic Island / Speaker notch placeholder subtle area -->
<div class="w-20 h-4 bg-transparent"></div>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="2.5" x="0" y="9"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="4" y="6.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="8" y="4"></rect>
<rect height="11" rx="0.5" width="2.5" x="12" y="1"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3 fill-current" viewbox="0 0 16 12">
<path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"></path>
<path d="M4.5 7.2a4.95 4.95 0 017 0 .8.8 0 001.1-1.1 6.55 6.55 0 00-9.2 0 .8.8 0 001.1 1.1z"></path>
<path d="M1.8 4.5a8.8 8.8 0 0112.4 0 .8.8 0 001.1-1.1 10.4 10.4 0 00-14.6 0 .8.8 0 001.1 1.1z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-current rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-3 bg-current rounded-sm"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- Scrollable Main View Container -->
<main class="flex-1 overflow-y-auto px-5 pt-2 pb-24 space-y-4" data-purpose="screen-content">
<!-- BEGIN: HeaderSection -->
<section class="flex items-center space-x-2 pt-1" data-purpose="screen-title">
<!-- Blue bar chart icon -->
<div class="text-[#3A57E8]">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M5 9.2h3V19H5zM10.5 4.5h3V19h-3zM16 12.8h3V19h-3z"></path>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900">Progress</h1>
</section>
<!-- END: HeaderSection -->
<!-- BEGIN: SegmentedTabs -->
<nav class="flex items-center justify-between bg-white rounded-2xl p-1 shadow-sm border border-slate-100" data-purpose="view-tabs">
<button class="flex-1 py-2 text-center text-xs font-semibold rounded-xl bg-[#3A57E8] text-white shadow-sm transition" type="button">
          Overview
        </button>
<button class="flex-1 py-2 text-center text-xs font-medium text-slate-500 hover:text-slate-700 transition" type="button">
          Decks
        </button>
<button class="flex-1 py-2 text-center text-xs font-medium text-slate-500 hover:text-slate-700 transition" type="button">
          Calendar
        </button>
</nav>
<!-- END: SegmentedTabs -->
<!-- BEGIN: OverallProgressCard -->
<section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 relative" data-purpose="overall-progress-card">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3.5">
<!-- Green target bullseye icon badge -->
<div class="w-11 h-11 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center flex-shrink-0">
<svg class="w-6 h-6 stroke-current fill-none stroke-2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<circle cx="12" cy="12" r="5"></circle>
<circle class="fill-current" cx="12" cy="12" r="2"></circle>
</svg>
</div>
<div>
<p class="text-xs font-medium text-slate-400">Overall Progress</p>
<p class="text-xl font-bold text-slate-900 mt-0.5">68%</p>
</div>
</div>
<!-- Right chevron -->
<svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Progress bar indicator -->
<div class="mt-4 w-full bg-slate-100 h-2 rounded-full overflow-hidden">
<div class="bg-[#00BFA5] h-2 rounded-full" style="width: 68%;"></div>
</div>
</section>
<!-- END: OverallProgressCard -->
<!-- BEGIN: MetricsGrid -->
<section class="grid grid-cols-2 gap-3" data-purpose="metrics-grid">
<!-- 1. Cards Studied -->
<div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between h-32">
<div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="12" rx="2" width="18" x="3" y="4"></rect>
<path d="M8 20h8M12 16v4" stroke-linecap="round"></path>
</svg>
</div>
<div>
<p class="text-[11px] font-medium text-slate-400">Cards Studied</p>
<div class="flex items-baseline space-x-1 mt-0.5">
<span class="text-lg font-bold text-slate-900">1,240</span>
</div>
<p class="text-[10px] text-slate-400">of 1,800</p>
</div>
</div>
<!-- 2. Study Time -->
<div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between h-32">
<div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7v5l3 2" stroke-linecap="round"></path>
</svg>
</div>
<div>
<p class="text-[11px] font-medium text-slate-400">Study Time</p>
<p class="text-lg font-bold text-slate-900 mt-0.5">14h 32m</p>
<p class="text-[10px] text-slate-400">total</p>
</div>
</div>
<!-- 3. Daily Goal -->
<div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between h-32">
<div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="15" rx="2" width="18" x="3" y="5"></rect>
<path d="M8 3v4M16 3v4M3 9h18" stroke-linecap="round"></path>
</svg>
</div>
<div>
<p class="text-[11px] font-medium text-slate-400">Daily Goal</p>
<p class="text-lg font-bold text-slate-900 mt-0.5">9 <span class="text-slate-400 text-sm font-semibold">/ 20</span></p>
<p class="text-[10px] text-slate-400">cards</p>
</div>
</div>
<!-- 4. Streak -->
<div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between h-32">
<div class="w-8 h-8 rounded-xl bg-orange-50 text-orange-500 flex items-center justify-center">
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.527.82-1.1 2.008-1.498 3.32-.4 1.317-.525 2.658-.337 3.66.19.997.712 1.764 1.488 2.148.06.03.119.064.179.098a4.996 4.996 0 01-2.95 2.673c-.562.197-1.164.298-1.77.298a5.952 5.952 0 01-3.66-1.253 1 1 0 00-1.242 1.564A7.95 7.95 0 006.725 18c1.077 0 2.138-.216 3.125-.638a6.994 6.994 0 004.148-4.225c.53-1.636.425-3.376-.237-4.885a10.96 10.96 0 00-1.366-2.228V6a1 1 0 00-2 0c0 .324-.042.646-.123.958a1 1 0 001.942.484c.15-.58.217-1.187.202-1.794a8.97 8.97 0 001.079 1.745c.42.544.75 1.157.973 1.815a1 1 0 101.894-.644A8.99 8.99 0 0012.395 2.553z" fill-rule="evenodd"></path>
</svg>
</div>
<div>
<p class="text-[11px] font-medium text-slate-400">Streak</p>
<p class="text-lg font-bold text-slate-900 mt-0.5">32 days</p>
<p class="text-[10px] text-transparent select-none"> </p>
</div>
</div>
</section>
<!-- END: MetricsGrid -->
<!-- BEGIN: ActivitySection -->
<section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100" data-purpose="activity-chart-container">
<div class="flex items-center justify-between mb-4">
<h2 class="text-sm font-bold text-slate-800">Your Activity</h2>
<a class="text-xs font-semibold text-[#3A57E8] flex items-center" href="#">
            View all
            <svg class="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
<!-- Weekly Activity Bar Chart -->
<div class="flex items-end justify-between h-28 pt-3 px-1 pb-1">
<!-- Mon -->
<div class="flex flex-col items-center space-y-2">
<div class="w-2.5 bg-[#00BFA5] rounded-full h-8"></div>
<span class="text-[10px] font-medium text-slate-400">Mon</span>
</div>
<!-- Tue -->
<div class="flex flex-col items-center space-y-2">
<div class="w-2.5 bg-[#00BFA5] rounded-full h-16"></div>
<span class="text-[10px] font-medium text-slate-400">Tue</span>
</div>
<!-- Wed -->
<div class="flex flex-col items-center space-y-2">
<div class="w-2.5 bg-[#00BFA5] rounded-full h-6"></div>
<span class="text-[10px] font-medium text-slate-400">Wed</span>
</div>
<!-- Thu -->
<div class="flex flex-col items-center space-y-2">
<div class="w-2.5 bg-[#00BFA5] rounded-full h-13" style="height: 52px;"></div>
<span class="text-[10px] font-medium text-slate-400">Thu</span>
</div>
<!-- Fri -->
<div class="flex flex-col items-center space-y-2">
<div class="w-2.5 bg-[#00BFA5] rounded-full h-13" style="height: 52px;"></div>
<span class="text-[10px] font-medium text-slate-400">Fri</span>
</div>
<!-- Sat -->
<div class="flex flex-col items-center space-y-2">
<div class="w-2.5 bg-[#00BFA5] rounded-full h-7"></div>
<span class="text-[10px] font-medium text-slate-400">Sat</span>
</div>
<!-- Sun (Light gradient / incomplete) -->
<div class="flex flex-col items-center space-y-2">
<div class="w-2.5 bg-gradient-to-b from-blue-200 to-indigo-100 rounded-full h-16"></div>
<span class="text-[10px] font-medium text-slate-400">Sun</span>
</div>
</div>
</section>
<!-- END: ActivitySection -->
</main>

<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Home</span>
</a>
<!-- Decks tab -->
<a class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition" href="#">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium">Decks</span>
</a>
<!-- Progress tab (Active) -->
<a class="flex flex-col items-center space-y-1 text-[#3A57E8]" href="#">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M5 9.2h3V19H5zM10.5 4.5h3V19h-3zM16 12.8h3V19h-3z"></path>
</svg>
<span class="text-[10px] font-bold">Progress</span>

<!-- Settings tab -->
<a class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition" href="#">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">

<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

<!-- END: BottomNavigation -->
<!-- iOS Home Bar Indicator -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900/30 rounded-full z-40"></div>
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
