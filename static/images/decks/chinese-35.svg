  <text x="22" y="30" font-family="sans-serif" font-weight="900" font-size="11" fill="#4F46E5">P</text>
  <text x="41" y="30" font-family="sans-serif" font-weight="900" font-size="11" fill="#4F46E5">Y</text>
  <!-- Spacebar indicator -->
