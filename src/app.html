<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>FlashCards — Smart Spaced Repetition</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta
			name="description"
			content="A modern, offline-first spaced repetition flashcards app for learning languages with smart SM-2 scheduling and cloud sync."
		/>
		<meta name="theme-color" content="#4F46E5" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="FlashCards" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/png" href="/mascots/flame.png" />
		<link rel="apple-touch-icon" href="/mascots/flame.png" />

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-surface font-sans text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"
	>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch((err) => {
						console.log('SW registration failed:', err);
					});
				});
			}
		</script>
	</body>
</html>
