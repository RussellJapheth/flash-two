<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>FlashCards - Home Dashboard</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#4F46E5',
              600: '#4338CA',
              700: '#3730A3',
            },
            accent: {
              teal: '#0D9488',
              tealLight: '#14B8A6',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(100, 116, 139, 0.08), 0 2px 6px -1px rgba(100, 116, 139, 0.04)',
            'btn': '0 8px 20px -4px rgba(79, 70, 229, 0.35)',
            'nav': '0 -4px 20px rgba(0, 0, 0, 0.03)'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Specific Visual Nuances -->
<style data-purpose="custom-layout">
    /* Hide scrollbars while preserving scrolling functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* iOS Safe Area handling */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style data-purpose="illustrations">
    /* Subtle overlay gradient for the scenery card */
    .scenery-card-bg {
      background: linear-gradient(180deg, rgba(238, 242, 255, 0.6) 0%, rgba(255, 255, 255, 0.95) 100%);
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-0 sm:p-4 text-slate-800 antialiased font-sans">
<!-- Mobile Shell Simulation (iPhone dimensions) -->
<main class="w-full max-w-[390px] h-[844px] bg-slate-50 relative rounded-[44px] shadow-2xl overflow-hidden flex flex-col border-[7px] border-slate-900 border-opacity-90 ring-1 ring-slate-900/10">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-slate-900 z-30 shrink-0 select-none" data-purpose="status-bar">
<!-- Time Display -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- System Status Icons -->
<div class="flex items-center space-x-2 text-slate-900">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A9.957 9.957 0 012 12C2 6.48 6.48 2 12 2c3.08 0 5.86 1.39 7.74 3.6l-.7.71A8.966 8.966 0 0012 3zm0 4a5 5 0 00-5 5c0 1.25.46 2.4 1.22 3.28l.71-.71A3.99 3.99 0 018 12a4 4 0 014-4c1.08 0 2.06.43 2.77 1.13l.71-.71A4.978 4.978 0 0012 7zm0 8a1 1 0 100-2 1 1 0 000 2z" opacity="0"></path>
<rect height="5" rx="1" width="3" x="2" y="16"></rect>
<rect height="9" rx="1" width="3" x="7" y="12"></rect>
<rect height="13" rx="1" width="3" x="12" y="8"></rect>
<rect height="17" rx="1" width="3" x="17" y="4"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A17.88 17.88 0 0012 4zm0 2.22c3.98 0 7.6 1.55 10.28 4.08L12 19.33 1.72 10.3A15.82 15.82 0 0112 6.22z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-900 rounded-[4px] p-0.5 flex items-center relative">
<div class="h-full w-full bg-slate-900 rounded-[1.5px]"></div>
<div class="absolute -right-1 top-1 w-0.5 h-1 bg-slate-900 rounded-r"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: ScrollableContent -->
<div class="flex-1 overflow-y-auto no-scrollbar px-6 pt-2 pb-24 space-y-5" data-purpose="main-dashboard-body">
<!-- BEGIN: TopBar -->
<nav class="flex items-center justify-between py-1" data-purpose="top-navigation">
<!-- Logo Branding -->
<div class="flex items-center space-x-2.5">
<div class="w-9 h-9 bg-brand-50 rounded-xl flex items-center justify-center text-brand-600 shadow-sm border border-brand-100/60">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="text-base font-bold tracking-tight leading-tight text-slate-900">FlashCards</span>
<span class="text-[11px] font-medium text-slate-400 leading-none mt-0.5">Learn. Practice. Master.</span>
</div>
</div>
<!-- Action Items (Notifications & Profile) -->
<div class="flex items-center space-x-3">
<!-- Notification Bell -->
<button aria-label="Notifications" class="relative w-9 h-9 rounded-full bg-white flex items-center justify-center text-slate-600 shadow-sm border border-slate-100 hover:bg-slate-50 transition">
<svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"></span>
</button>
<!-- User Avatar Placeholder -->
<div class="w-9 h-9 rounded-full ring-2 ring-white shadow-sm overflow-hidden bg-slate-200 border border-slate-200 shrink-0">
<img alt="User Profile Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBhMnok6L7pNcJttLg30FFQOkXiYSYaplpLOpbGBJ1dCXPc9QBaxgjcJFI0LPBiCprvtYnq_YDBVhoESckkZoFRqi9aOaBDPyar0rykHKFVFiw-An8VksKvRnvfWN0zKLlNzmxGYxo_9uTVTBlr7hVTPNex8Mr3g6aJDFKKiMfpz3iS8xOmsH5pRX2Awa6quVwrnEgIJMfLUGzJ38KmXiB2WUL1S9Ew8WmsaJcPDRGneaqkHTnE8zIY"/>
</div>
</div>
</nav>
<!-- END: TopBar -->
<!-- BEGIN: HeroSection -->
<section class="relative rounded-3xl overflow-hidden pt-4 pb-2 px-1" data-purpose="greeting-hero">
<div class="space-y-1 relative z-10">
<p class="text-[13px] font-medium text-slate-500 tracking-wide">Good morning,</p>
<h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-1.5">
            Russell! <span class="text-xl">👋</span>
</h1>
<p class="text-xs text-slate-500 font-normal leading-relaxed max-w-[210px] pt-1">
            Small steps, big progress. Let's turn your next few minutes into real progress.
          </p>
</div>
<!-- Illustrated Pagoda & Cherry Blossom Scenery Graphic -->
<div class="w-full h-36 relative mt-1 overflow-hidden rounded-2xl flex items-end justify-end">
<!-- Stylized Scenic SVG Illustration -->
<svg class="absolute inset-0 w-full h-full" fill="none" preserveaspectratio="xMidYMax slice" viewbox="0 0 350 160">
<defs>
<lineargradient id="skyGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.7"></stop>
<stop offset="60%" stop-color="#FCE7F3" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
</lineargradient>
<lineargradient id="mountainFar" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.3"></stop>
</lineargradient>
<lineargradient id="mountainMid" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#93C5FD" stop-opacity="0.7"></stop>
<stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.2"></stop>
</lineargradient>
</defs>
<!-- Sky backdrop -->
<rect fill="url(#skyGrad)" height="160" rx="16" width="350"></rect>
<!-- Distant Mountains -->
<path d="M10 160 L75 80 L140 160 Z" fill="url(#mountainFar)" opacity="0.6"></path>
<path d="M100 160 L180 65 L260 160 Z" fill="url(#mountainMid)" opacity="0.8"></path>
<path d="M-20 160 L60 95 L140 160 Z" fill="#E2E8F0" opacity="0.5"></path>
<!-- Soft Sun / Glow -->
<circle cx="210" cy="65" fill="#FEF08A" opacity="0.45" r="28"></circle>
<!-- Multi-tiered Pagoda / Asian Temple Silhouette -->
<g fill="#B45309" transform="translate(195, 42)">
<!-- Spire -->
<rect fill="#78350F" height="14" width="2" x="39" y="0"></rect>
<polygon fill="#92400E" points="40,2 38,10 42,10"></polygon>
<!-- Tier 1 Roof -->
<path d="M28 20 C34 16, 46 16, 52 20 L48 15 C44 14, 36 14, 32 15 Z" fill="#9A3412"></path>
<rect fill="#B45309" height="7" width="10" x="35" y="20"></rect>
<!-- Tier 2 Roof -->
<path d="M22 30 C32 25, 48 25, 58 30 L54 26 C46 23, 34 23, 26 26 Z" fill="#9A3412"></path>
<rect fill="#B45309" height="9" width="18" x="31" y="30"></rect>
<!-- Tier 3 Roof (Bottom & Wider) -->
<path d="M15 42 C28 36, 52 36, 65 42 L60 38 C48 34, 32 34, 20 38 Z" fill="#7C2D12"></path>
<rect fill="#9A3412" height="14" width="26" x="27" y="42"></rect>
<!-- Base Pillars & Walls -->
<rect fill="#78350F" height="30" opacity="0.9" width="36" x="22" y="56"></rect>
<rect fill="#FEF3C7" height="20" opacity="0.8" width="10" x="35" y="66"></rect>
</g>
<!-- Cherry Blossoms & Branch (Foreground details on Right) -->
<path d="M360 30 Q310 50 280 85" fill="none" opacity="0.8" stroke="#78350F" stroke-linecap="round" stroke-width="3"></path>
<path d="M310 52 Q285 40 265 45" fill="none" opacity="0.8" stroke="#78350F" stroke-linecap="round" stroke-width="2"></path>
<!-- Blossom Petals -->
<circle cx="275" cy="85" fill="#F472B6" opacity="0.9" r="4.5"></circle>
<circle cx="265" cy="45" fill="#F472B6" opacity="0.9" r="4"></circle>
<circle cx="282" cy="48" fill="#FB7185" opacity="0.85" r="5"></circle>
<circle cx="305" cy="50" fill="#FDA4AF" opacity="0.9" r="4.5"></circle>
<circle cx="325" cy="40" fill="#F472B6" opacity="0.85" r="5"></circle>
<circle cx="340" cy="55" fill="#FDA4AF" opacity="0.8" r="4"></circle>
<circle cx="295" cy="70" fill="#FB7185" opacity="0.9" r="3.5"></circle>
<!-- Floating loose petals -->
<circle cx="245" cy="75" fill="#F472B6" opacity="0.6" r="2.5"></circle>
<circle cx="230" cy="100" fill="#FB7185" opacity="0.5" r="2"></circle>
<circle cx="260" cy="115" fill="#FDA4AF" opacity="0.7" r="2"></circle>
</svg>
</div>
</section>
<!-- END: HeroSection -->
<!-- BEGIN: CallToActionButtons -->
<section class="space-y-2.5 pt-1" data-purpose="primary-actions">
<!-- Start Studying (Primary Pill Button) -->
<button class="w-full h-12 bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 active:scale-[0.99] transition-all text-white font-semibold text-sm rounded-2xl shadow-btn flex items-center justify-between px-6">
<span class="w-4"></span>
<div class="flex items-center space-x-2">
<!-- Play Arrow -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M8 5v14l11-7z"></path>
</svg>
<span class="tracking-wide">Start Studying</span>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- View Progress (Secondary Outlined Button) -->
<button class="w-full h-11 bg-white hover:bg-slate-50 active:scale-[0.99] transition border border-indigo-100/90 text-indigo-700 font-medium text-xs rounded-2xl shadow-sm flex items-center justify-center space-x-2">
<!-- Bar Chart Icon -->
<svg class="w-4 h-4 stroke-current stroke-2 text-indigo-600" fill="none" viewbox="0 0 24 24">
<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="tracking-tight">View Progress</span>
</button>
</section>
<!-- END: CallToActionButtons -->
<!-- BEGIN: MetricsDashboardGrid -->
<section class="grid grid-cols-2 gap-3 pt-1" data-purpose="metrics-grid">
<!-- Card 1: Overall Progress -->
<article class="bg-white rounded-2xl p-3.5 shadow-card border border-slate-100 flex flex-col justify-between h-[105px]">
<div class="flex items-center space-x-2">
<!-- Target Icon -->
<div class="w-6 h-6 rounded-full bg-emerald-50 flex items-center justify-center text-teal-600 shrink-0">
<svg class="w-4 h-4 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<circle cx="12" cy="12" r="5"></circle>
<circle cx="12" cy="12" r="1"></circle>
</svg>
</div>
<span class="text-[11px] font-medium text-slate-500 leading-tight">Overall Progress</span>
</div>
<div class="space-y-1.5 pl-0.5">
<span class="text-lg font-bold text-slate-900 tracking-tight block leading-none">68%</span>
<!-- Progress Line Indicator -->
<div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
<div class="bg-teal-500 h-full rounded-full" style="width: 68%;"></div>
</div>
</div>
</article>
<!-- Card 2: Cards Studied -->
<article class="bg-white rounded-2xl p-3.5 shadow-card border border-slate-100 flex flex-col justify-between h-[105px]">
<div class="flex items-center space-x-2">
<!-- Screen / Flashcard Icon -->
<div class="w-6 h-6 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 shrink-0">
<svg class="w-3.5 h-3.5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<rect height="14" rx="2" width="20" x="2" y="4"></rect>
<path d="M8 20h8" stroke-linecap="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium text-slate-500 leading-tight">Cards Studied</span>
</div>
<div class="pl-0.5">
<span class="text-lg font-bold text-slate-900 tracking-tight block leading-tight">1,240</span>
<span class="text-[10px] text-slate-400 font-medium leading-none">of 1,800</span>
</div>
</article>
<!-- Card 3: Study Time -->
<article class="bg-white rounded-2xl p-3.5 shadow-card border border-slate-100 flex flex-col justify-between h-[105px]">
<div class="flex items-center space-x-2">
<!-- Clock Icon -->
<div class="w-6 h-6 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 shrink-0">
<svg class="w-3.5 h-3.5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7v5l3 2" stroke-linecap="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium text-slate-500 leading-tight">Study Time</span>
</div>
<div class="pl-0.5">
<span class="text-lg font-bold text-slate-900 tracking-tight block leading-tight">14h 32m</span>
<span class="text-[10px] text-slate-400 font-medium leading-none">total</span>
</div>
</article>
<!-- Card 4: Daily Goal -->
<article class="bg-white rounded-2xl p-3.5 shadow-card border border-slate-100 flex flex-col justify-between h-[105px]">
<div class="flex items-center space-x-2">
<!-- Calendar Goal Icon -->
<div class="w-6 h-6 rounded-full bg-violet-50 flex items-center justify-center text-violet-600 shrink-0">
<svg class="w-3.5 h-3.5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<rect height="18" rx="2" width="18" x="3" y="4"></rect>
<path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium text-slate-500 leading-tight">Daily Goal</span>
</div>
<div class="pl-0.5">
<div class="flex items-baseline space-x-1">
<span class="text-lg font-bold text-slate-900 leading-tight">9</span>
<span class="text-xs text-slate-500 font-semibold">/ 20</span>
</div>
<span class="text-[10px] text-slate-400 font-medium leading-none">cards</span>
</div>
</article>
</section>
<!-- END: MetricsDashboardGrid -->
</div>
<!-- END: ScrollableContent -->
<!-- BEGIN: BottomNavigationBar -->
<nav class="absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-100 shadow-nav px-5 pt-2 pb-6 flex justify-between items-center z-40" data-purpose="bottom-tab-bar">
<!-- Home Tab (Active) -->
<a class="flex flex-col items-center justify-center text-brand-600 w-14 group" href="#">
<svg class="w-5 h-5 fill-current transition-transform group-hover:scale-105" viewbox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
</svg>
<span class="text-[10px] font-semibold tracking-tight mt-1">Home</span>
</a>
<!-- Decks Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-14 group transition" href="#">
<!-- Card Stack Icon -->
<svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight mt-1">Decks</span>
</a>
<!-- Progress Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-14 group transition" href="#">
<!-- Analytics Icon -->
<svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight mt-1">Progress</span>
</a>
<!-- Settings Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 w-14 group transition" href="#">
<!-- Gear Settings Icon -->
<svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight mt-1">Settings</span>
</a>
</nav>
<!-- END: BottomNavigationBar -->
<!-- BEGIN: iOSHomeIndicator -->
<div class="absolute bottom-1 inset-x-0 flex justify-center pb-1 z-50 pointer-events-none" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-900/40 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</main>
