<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Speed Blue Background Gradient -->
    <linearGradient id="nr-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Top Gloss Sheen -->
    <linearGradient id="nr-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Speed Lightning / Streak Gold -->
    <linearGradient id="nr-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Tactile Card Shadow -->
    <filter id="nr-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#nr-bg)"/>

  <!-- Top Glass Highlight -->
  <rect x="1" y="1" width="62" height="28" rx="15" fill="url(#nr-gloss)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>

  <!-- Speed Motion Wind Lines -->
  <path d="M8 20 H18 M6 32 H14 M9 44 H16" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M48 16 H54 M50 48 H56" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Hanzi Number Tile (Left: '八' 8) -->
  <g filter="url(#nr-shadow)">
    <rect x="13" y="16" width="18" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- Hanzi character '八' -->
    <path d="M20 23 C19 26, 17 29, 15.5 34 M22 21 C24 25, 26.5 30, 29 35" 
          stroke="#0284C7" stroke-width="2.75" stroke-linecap="round"/>
  </g>

  <!-- Arabic Digit Number Tile (Right: '8') -->
  <g filter="url(#nr-shadow)">
    <rect x="33" y="16" width="18" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- Digit '8' -->
    <circle cx="42" cy="24" r="3.75" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <circle cx="42" cy="33" r="4.5" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  </g>

  <!-- Speed Blitz Bolt & Rush Dash (Between & connecting tiles) -->
  <path d="M34 11 L27 24 H33 L29 37 L39 22 H32 Z" 
        fill="url(#nr-gold)" stroke="#B45309" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- Speed Timer Ticks at Bottom -->
  <rect x="19" y="47" width="26" height="8" rx="4" fill="#0F172A" fill-opacity="0.4"/>
  <circle cx="24" cy="51" r="1.75" fill="#38BDF8"/>
  <circle cx="32" cy="51" r="1.75" fill="#FCD34D"/>
  <circle cx="40" cy="51" r="1.75" fill="#4ADE80"/>
</svg>
